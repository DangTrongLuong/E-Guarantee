plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// ---- Core (required by the assignment) ----
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Liquibase — required for schema migration
	implementation 'org.liquibase:liquibase-core'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// ---- Database driver ----
	runtimeOnly 'com.mysql:mysql-connector-j'

	// ---- Redis ----
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// ---- Testing ----
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// =====================================================================
	// OPTIONAL / BONUS
	// =====================================================================

	// --- #12 DTO mapping (MapStruct) ---
	 implementation 'org.mapstruct:mapstruct:1.6.3'
	 annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	// If combining MapStruct with Lombok, also add (order matters, keep this last):
	 annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// --- #15 Spring Security + JWT ---
	 implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	 implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	 runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	 runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	 testImplementation 'org.springframework.security:spring-security-test'

	// --- #16 Scheduled Job ---
	// No extra dependency needed.

	// --- #17 Spring Batch ---
	// implementation 'org.springframework.boot:spring-boot-starter-batch'
	// testImplementation 'org.springframework.batch:spring-batch-test'
	// implementation 'org.apache.commons:commons-csv:1.11.0'

	// --- #18 Optimistic Locking ---
	// No extra dependency needed.

	// --- #19 Testing with Testcontainers ---
	// testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
	// testImplementation 'org.testcontainers:junit-jupiter'
	// testImplementation 'org.testcontainers:mysql'

	// --- #20 Swagger / OpenAPI ---
	 implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	// Cloudinary
	implementation 'com.cloudinary:cloudinary-http44:1.39.0'
}

tasks.named('test') {
	useJUnitPlatform()
}