databaseChangeLog:
  - changeSet:
      id: 03-create-table-guarantee-requests
      author: system
      validCheckSum: ANY
      comment: Tạo bảng guarantee_requests tương ứng entity GuaranteeRequest
      changes:
        - createTable:
            tableName: guarantee_requests
            columns:
              - column:
                  name: id
                  type: VARCHAR(20)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_guarantee_requests
                    nullable: false
              - column:
                  name: customer_cif
                  type: VARCHAR(12)
                  constraints:
                    nullable: false
              - column:
                  name: guarantee_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: guarantee_amount
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  defaultValue: VND
                  constraints:
                    nullable: false
              - column:
                  name: effective_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: tender_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: related_contract_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: reference_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: purpose
                  type: VARCHAR(1000)
                  constraints:
                    nullable: true
              - column:
                  name: beneficiary_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: beneficiary_address
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: contact_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: VARCHAR(15)
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: DRAFT
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: updated_date
                  type: DATETIME
                  constraints:
                    nullable: true
      rollback:
        - dropTable:
            tableName: guarantee_requests

  - changeSet:
      id: 03-1-fk-guarantee-requests-customer
      author: system
      comment: FK guarantee_requests.customer_cif -> customers.cif
      changes:
        - addForeignKeyConstraint:
            baseTableName: guarantee_requests
            baseColumnNames: customer_cif
            constraintName: fk_gr_customer_cif
            referencedTableName: customers
            referencedColumnNames: cif
            onDelete: RESTRICT
            onUpdate: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: guarantee_requests
            constraintName: fk_gr_customer_cif

