  - changeSet:
      id: 03-4-check-guarantee-requests
      author: system
      comment: Các ràng buộc CHECK trên guarantee_requests
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql,mariadb
      changes:
        - sql:
            sql: >
              ALTER TABLE guarantee_requests
              ADD CONSTRAINT chk_gr_expiry_after_effective
              CHECK (expiry_date > effective_date);
        - sql:
            sql: >
              ALTER TABLE guarantee_requests
              ADD CONSTRAINT chk_gr_tender_number_required
              CHECK (guarantee_type <> 'BID_BOND'
                     OR (tender_number IS NOT NULL
                         AND CHAR_LENGTH(TRIM(tender_number)) > 0));
        - sql:
            sql: >
              ALTER TABLE guarantee_requests
              ADD CONSTRAINT chk_gr_amount_range
              CHECK (guarantee_amount > 0 AND guarantee_amount <= 1000000000000);
        - sql:
            sql: >
              ALTER TABLE guarantee_requests
              ADD CONSTRAINT chk_gr_phone_number_format
              CHECK (phone_number IS NULL OR phone_number REGEXP '^[0-9]{9,15}$');
      rollback:
        - sql:
            sql: ALTER TABLE guarantee_requests DROP CHECK chk_gr_expiry_after_effective;
        - sql:
            sql: ALTER TABLE guarantee_requests DROP CHECK chk_gr_tender_number_required;
        - sql:
            sql: ALTER TABLE guarantee_requests DROP CHECK chk_gr_amount_range;
        - sql:
            sql: ALTER TABLE guarantee_requests DROP CHECK chk_gr_phone_number_format;

