  - changeSet:
      id: 04-3-check-processing-histories-reject-comment
      author: system
      comment: Ràng buộc CHECK - action REJECT bắt buộc có comment từ 10-500 ký tự
      preConditions:
        - onFail: MARK_RAN
        - dbms:
            type: mysql,mariadb
      changes:
        - sql:
            sql: >
              ALTER TABLE processing_histories
              ADD CONSTRAINT chk_ph_reject_comment
              CHECK (action <> 'REJECT'
                     OR (comment IS NOT NULL
                         AND CHAR_LENGTH(TRIM(comment)) BETWEEN 10 AND 500));
      rollback:
        - sql:
            sql: ALTER TABLE processing_histories DROP CHECK chk_ph_reject_comment;