databaseChangeLog:
  - changeSet:
      id: 04-create-table-processing-histories
      author: system
      comment: Tạo bảng processing_histories tương ứng entity ProcessingHistory
      changes:
        - createTable:
            tableName: processing_histories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_processing_histories
                    nullable: false
              - column:
                  name: guarantee_id
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: performed_by
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
      rollback:
        - dropTable:
            tableName: processing_histories

  - changeSet:
      id: 04-1-fk-processing-histories-guarantee
      author: system
      comment: FK processing_histories.guarantee_id -> guarantee_requests.id
      changes:
        - addForeignKeyConstraint:
            baseTableName: processing_histories
            baseColumnNames: guarantee_id
            constraintName: fk_ph_guarantee_id
            referencedTableName: guarantee_requests
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: processing_histories
            constraintName: fk_ph_guarantee_id

